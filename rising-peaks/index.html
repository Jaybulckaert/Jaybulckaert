<title>Rising Peaks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #EEF0F2; --paper-2: #E2E6EA; --ink: #1B2028; --ink-2: #4A5462; --rule: #B9B3A6;
    --sky: #3F6A9E; --flag: #E4612B; --panel: #0E1216; --panel-text: #E6E9EE;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #14181E; --paper-2: #1C222A; --ink: #E6E9EE; --ink-2: #A3ACB8; --rule: #4E5560; --sky: #7FA6D6; --flag: #F07A45; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #14181E; --paper-2: #1C222A; --ink: #E6E9EE; --ink-2: #A3ACB8; --rule: #4E5560; --sky: #7FA6D6; --flag: #F07A45; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 20px; padding-block: 24px 48px; }
  .wrap { max-width: 1400px; margin-inline: auto; display: grid; gap: 20px; }
  header { display: grid; gap: 6px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 5vw, 56px); line-height: 1; margin: 0; text-wrap: balance; }
  .lede { max-width: 64ch; color: var(--ink-2); margin: 0; }
  .lede b { color: var(--ink); font-weight: 500; }

  .tabs { display: flex; gap: 0; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; width: max-content; max-width: 100%; }
  .tab { font: 500 14px var(--font-body); color: var(--ink-2); background: var(--paper-2); border: 0; padding: 10px 16px; cursor: pointer; display: grid; gap: 1px; text-align: left; }
  .tab + .tab { border-left: 1px solid var(--rule); }
  .tab small { font: 400 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .tab[aria-selected="true"] small { color: #FFB08A; }

  .stage { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .stage canvas { display: block; width: 100%; height: auto; max-width: 100%; }
  .hud { position: absolute; left: 12px; top: 12px; display: grid; gap: 2px; padding: 8px 12px; background: rgba(14,18,22,0.72); color: var(--panel-text); border-radius: 3px; backdrop-filter: blur(3px); font-variant-numeric: tabular-nums; pointer-events: none; }
  .hud .big { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; }
  .hud .big small { font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: 0.08em; margin-left: 6px; color: #FFB08A; }
  .hud .sub { font: 400 12px var(--font-mono); color: #C9D0D8; }
  .hud .sub b { color: #fff; font-weight: 500; }
  .render { position: absolute; inset: 0; background: var(--panel); display: grid; }
  .render[hidden] { display: none; }
  .render video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .render .tag { position: absolute; right: 12px; top: 12px; padding: 6px 10px; background: rgba(14,18,22,0.72); color: #FFB08A; border-radius: 3px; font: 500 11.5px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; pointer-events: none; }
  button[disabled] { opacity: 0.45; cursor: not-allowed; }
  button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .loading[hidden] { display: none; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--panel-text); font: 500 14px var(--font-mono); background: rgba(14,18,22,0.6); }

  .bench { display: grid; grid-template-columns: 1fr auto; gap: 18px 28px; align-items: end; padding-block: 14px; border-block: 1px solid var(--rule); }
  @media (max-width: 720px) { .bench { grid-template-columns: 1fr; } }
  .ctl { display: grid; gap: 6px; }
  .ctl label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .ctl input[type="range"] { width: 100%; accent-color: var(--flag); height: 28px; }
  .scale-row { display: flex; align-items: center; gap: 12px; }
  .scale-row .ends { font: 500 12px var(--font-mono); color: var(--ink-2); white-space: nowrap; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  button { font: 500 14px var(--font-body); color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--flag); border-color: var(--flag); color: #fff; }
  button:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
  .opts { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .check input[type="checkbox"] { accent-color: var(--flag); width: 16px; height: 16px; }
  .num { font: 500 15px var(--font-mono); color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; width: 90px; }

  .notes { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 820px) { .notes { grid-template-columns: 1fr; } }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; margin: 0 0 8px; }
  .notes p { max-width: 62ch; margin: 0 0 10px; }
  .formula { font: 400 13.5px/1.6 var(--font-mono); background: var(--paper-2); border-left: 3px solid var(--sky); padding: 10px 14px; margin: 10px 0; white-space: pre; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font: 500 11.5px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  td.n, th.n { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  tr.you td { color: var(--flag); font-weight: 500; }
  .foot { font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Banff · two frames · single-frame composites</div>
    <h1>Rising Peaks</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="tabs" role="tablist" aria-label="Choose a photo" id="tabs"></div>

  <div class="stage" id="stage">
    <canvas id="c" width="4" height="3" aria-label="Photo with only the background mountains scaled by the slider"></canvas>
    <div class="hud">
      <div class="big"><span id="hudScale">—</span><small id="hudMag">1.000×</small></div>
      <div class="sub">peak rise <b id="hudM">—</b> · <b id="hudPct">100%</b> of the original rise</div>
    </div>
    <div class="loading" id="loading" hidden>loading plates…</div>
    <div class="render" id="render" hidden>
      <video id="renderVideo" playsinline loop muted preload="metadata" aria-label="Runway image-to-video render of the mountains growing"></video>
      <div class="tag" id="renderTag">Runway render · 10 s</div>
    </div>
  </div>

  <section class="bench" aria-label="Controls">
    <div class="ctl">
      <label for="scale">Mountain scale against your height</label>
      <div class="scale-row">
        <span class="ends" id="endL">1600 : 1</span>
        <input id="scale" type="range" min="1600" max="5000" step="10" value="1600">
        <span class="ends">5000 : 1</span>
        <input id="scaleNum" class="num" type="number" min="1600" max="5000" step="10" value="1600" aria-label="Scale, exact">
      </div>
    </div>
    <div class="buttons">
      <button class="primary" id="play" type="button">Grow to 5000 : 1</button>
      <button id="reset" type="button">Back to start</button>
      <button id="hold" type="button" title="Hold to see the untouched photo">Hold: original</button>
      <button id="renderBtn" type="button" title="Runway image-to-video render of this scene">Runway render</button>
    </div>
    <div class="opts">
      <label class="check"><input id="outline" type="checkbox" checked> Original ridge outlines</label>
      <label class="check"><input id="layers" type="checkbox"> Show the cut</label>
      <label class="check">Your height, m <input id="height" class="num" type="number" step="0.01" min="0.5" max="3" value="1.80"></label>
    </div>
  </section>

  <section class="notes">
    <div>
      <h2>What is actually moving</h2>
      <p id="how"></p>
      <div class="formula" id="formula"></div>
      <p class="foot" id="foot"></p>
    </div>
    <div>
      <h2>Rise in metres at each scale</h2>
      <table id="cmp"><thead><tr><th>Reference</th><th class="n">Metres</th><th class="n">× you</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</div>

<script>
(function () {
  const SCENES = [{"name": "Banff Avenue", "leftScale": 1600, "W": 2576, "H": 1932, "fgY0": 425, "plates": [{"y0": 969, "pivot": [1245, 1460], "peak": [1245, 973], "ridge": [[0, 1190], [200, 1150], [400, 1110], [548, 1095], [600, 1092], [650, 1087], [700, 1080], [750, 1074], [800, 1082], [827, 1087], [850, 1088], [880, 1080], [905, 1078], [930, 1060], [960, 1052], [1000, 1044], [1030, 1027], [1050, 1030], [1080, 1017], [1105, 1007], [1130, 1005], [1160, 1005], [1180, 1000], [1210, 985], [1230, 975], [1245, 965], [1260, 972], [1290, 980], [1315, 1005], [1340, 1020], [1370, 1050], [1390, 1055], [1410, 1065], [1430, 1080], [1440, 1105], [1460, 1110], [1480, 1117], [1500, 1127], [1520, 1140], [1540, 1155], [1560, 1165]]}], "base": "../scale-bench/banff-cascade.jpg", "fg": "../scale-bench/foreground.webp", "plateSrc": ["../scale-bench/mountain.webp"], "lede": "One photo, three plates. Cascade Mountain is cut out and scaled about its base. The sky behind it and the street, houses and spruce in front of it never move. Drag from <b>1600 : 1</b> to <b>5000 : 1</b> and watch the peak climb.", "how": "The <b>back plate</b> is the untouched photograph. The <b>mountain plate</b> is Cascade and its treed flanks, cut along the ridge against the sky, with the rock reconstructed behind the spruce, the roofs and the town treeline so no hole opens when it moves. The <b>front plate</b> is everything nearer than the mountain: the big spruce, the streetlights, the houses, the street.", "foot": "The ridge is accurate to a pixel or two. The right flank behind the spruce is reconstructed and becomes visible above about 2.5\u00d7. Cascade's real rise above the townsite is about 1 615 m, roughly 900 of a 1.8 m person; the 1600 : 1 label is your reading of the frame and the metre figures follow from it.", "video": null}, {"name": "Recreation Grounds", "leftScale": 1400, "W": 2448, "H": 1836, "fgY0": 760, "plates": [{"name": "left", "y0": 786, "pivot": [272.5, 1075.0], "peak": [272.5, 790], "ridge": [[0.0, 803.0], [50.0, 799.0], [100.0, 806.0], [135.0, 812.0], [165.0, 803.0], [200.0, 798.0], [235.0, 793.0], [272.5, 787.0], [300.0, 790.0], [325.0, 796.0], [350.0, 800.0], [380.0, 806.0], [410.0, 815.0], [430.0, 821.5], [450.0, 825.5], [475.0, 838.0], [500.0, 846.5], [525.0, 863.0], [550.0, 880.0], [575.0, 892.5], [600.0, 907.0], [625.0, 921.5], [650.0, 938.0], [670.0, 950.5]]}, {"name": "right", "y0": 809, "pivot": [1789.0, 1075.0], "peak": [1789.0, 813], "ridge": [[1530.0, 915.0], [1575.0, 900.0], [1623.5, 877.5], [1633.0, 874.5], [1655.0, 871.5], [1670.5, 859.0], [1692.5, 845.0], [1717.5, 848.0], [1742.5, 838.5], [1767.5, 818.5], [1789.0, 811.5], [1811.0, 818.5], [1830.0, 827.5], [1842.5, 837.0]]}], "base": "../park-peaks/park-base.jpg", "fg": "../park-peaks/foreground.webp", "plateSrc": ["../park-peaks/mountain-left.webp", "../park-peaks/mountain-right.webp"], "lede": "One photo, four plates. The range on the left and the peak on the right are each cut out and scaled about their own base, together, on one slider. The sky behind them and the trees, cars, buildings and you in front of them never move. Drag from <b>1400 : 1</b> to <b>5000 : 1</b>.", "how": "The <b>back plate</b> is the untouched photograph. Two <b>mountain plates</b> hold the range on the left and the peak on the right, each cut along its ridge against the sky, with slopes reconstructed behind the trees. The <b>front plate</b> is everything nearer than the mountains: every tree, the kiosk, the cars, the house, the lawn, and you. Past about 2.5\u00d7 the two flanks meet behind the trees and overlap, the way ranges do. The Runway render is an image-to-video pass anchored on the untouched photo and on the 5000 : 1 composite, so the model invented the motion in between and repainted the reconstructed slopes.", "foot": "Both ridges are accurate to a pixel or two at half resolution. The slopes hidden behind the trees are reconstructed, and that band directly above the treeline is what you see at high magnification. The 1400 : 1 label is your reading of the frame and the metre figures follow from it.", "video": "renders/recreation-grounds-runway.mp4"}];
  const MAX_SCALE = 5000;
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const scaleIn = $('scale'), scaleNum = $('scaleNum');
  const fmt = n => Math.round(n).toLocaleString('en-CA').replace(/,/g, ' ');
  const state = { i: 0, scale: SCENES[0].leftScale, height: 1.8, showOriginal: false, anim: null, render: false };
  const S = () => SCENES[state.i];
  const mag = () => state.scale / S().leftScale;

  // ---- image cache per scene ----
  const cache = SCENES.map(() => null);
  function load(i, done) {
    if (cache[i] && cache[i].ready) { done(); return; }
    if (cache[i]) { cache[i].waiters.push(done); return; }
    const sc = SCENES[i];
    const entry = { base: new Image(), fg: new Image(), plates: sc.plates.map(() => new Image()), ready: false, waiters: [done] };
    cache[i] = entry;
    let n = 0; const need = 2 + sc.plates.length;
    const onl = () => { if (++n === need) { entry.ready = true; entry.waiters.splice(0).forEach(f => f()); } };
    entry.base.onload = entry.fg.onload = onl; entry.plates.forEach(im => im.onload = onl);
    entry.base.src = sc.base; entry.fg.src = sc.fg; entry.plates.forEach((im, k) => im.src = sc.plateSrc[k]);
  }

  function draw() {
    const sc = S(), im = cache[state.i];
    if (!im || !im.ready) return;
    const W = sc.W, H = sc.H, s = state.showOriginal ? 1 : mag();
    const showCut = $('layers').checked;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(im.base, 0, 0);
    sc.plates.forEach((p, k) => {
      ctx.save();
      ctx.translate(p.pivot[0], p.pivot[1]); ctx.scale(s, s); ctx.translate(-p.pivot[0], -p.pivot[1]);
      ctx.drawImage(im.plates[k], 0, p.y0);
      if (showCut) { ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = k ? 'rgba(255,196,60,0.45)' : 'rgba(228,97,43,0.45)'; ctx.fillRect(0, p.y0, W, H); ctx.globalCompositeOperation = 'source-over'; }
      ctx.restore();
    });
    if (showCut) {
      const off = draw.off || (draw.off = document.createElement('canvas'));
      off.width = W; off.height = H - sc.fgY0;
      const o = off.getContext('2d'); o.clearRect(0, 0, off.width, off.height); o.drawImage(im.fg, 0, 0);
      o.globalCompositeOperation = 'source-atop'; o.fillStyle = 'rgba(80,200,110,0.45)'; o.fillRect(0, 0, off.width, off.height);
      ctx.drawImage(off, 0, sc.fgY0);
    } else {
      ctx.drawImage(im.fg, 0, sc.fgY0);
    }
    const lw = Math.max(2, W / 860);
    if ($('outline').checked && !state.showOriginal && s > 1.001) {
      ctx.save(); ctx.setLineDash([6 * lw, 4 * lw]); ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      sc.plates.forEach(p => { ctx.beginPath(); p.ridge.forEach((q, k) => k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); });
      ctx.setLineDash([]);
      sc.plates.forEach(p => { ctx.fillStyle = '#E4612B'; ctx.strokeStyle = '#fff'; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(p.peak[0], p.peak[1], 3 * lw, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
      ctx.restore();
    }
    let rise = 1;
    sc.plates.forEach(p => {
      const py = p.pivot[1] - (p.pivot[1] - p.peak[1]) * s, px = p.pivot[0] + (p.peak[0] - p.pivot[0]) * s;
      if (!state.showOriginal) { ctx.save(); ctx.fillStyle = '#E4612B'; ctx.strokeStyle = '#fff'; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(px, py, 3.6 * lw, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore(); }
      rise = (p.pivot[1] - py) / (p.pivot[1] - p.peak[1]);
    });
    const shown = state.showOriginal ? sc.leftScale : state.scale;
    $('hudScale').textContent = `${fmt(shown)} : 1`;
    $('hudMag').textContent = (shown / sc.leftScale).toFixed(3) + '×';
    $('hudM').textContent = fmt(shown * state.height) + ' m';
    $('hudPct').textContent = Math.round(rise * 100) + '%';
    $('formula').textContent =
`magnification  = ${fmt(state.scale)} / ${sc.leftScale} = ${mag().toFixed(4).replace(/\.?0+$/, '')}
${sc.plates.length > 1 ? 'each mountain ' : 'mountain plate'} = scaled ${mag().toFixed(3)}× about its own base under the summit
back and front = never transformed`;
    drawTable();
  }

  const REFS = [
    { name: 'Cascade Mountain, real rise above Banff', m: 1615 },
    { name: 'Cascade Mountain, summit elevation', m: 2998 },
    { name: 'Mount Robson, highest in the Canadian Rockies', m: 3954 },
    { name: 'Mount Logan, highest in Canada', m: 5959 },
    { name: 'Mount Everest, summit elevation', m: 8849 },
  ];
  function drawTable() {
    const sc = S();
    const rows = [
      { name: 'You', m: state.height, you: true },
      { name: `Peak at ${fmt(sc.leftScale)} : 1`, m: sc.leftScale * state.height, you: true },
      { name: `Peak at ${fmt(state.scale)} : 1 (slider)`, m: state.scale * state.height, you: true },
      { name: 'Peak at 5000 : 1', m: MAX_SCALE * state.height, you: true },
      ...REFS,
    ].sort((a, b) => a.m - b.m);
    $('cmp').querySelector('tbody').innerHTML = rows.map(r =>
      `<tr${r.you ? ' class="you"' : ''}><td>${r.name}</td><td class="n">${r.m < 10 ? r.m.toFixed(2) : fmt(r.m)}</td><td class="n">${(r.m / state.height) < 10 ? (r.m / state.height).toFixed(1) : fmt(r.m / state.height)}</td></tr>`
    ).join('');
  }

  function setScale(v, fromAnim) {
    const lo = S().leftScale;
    v = Math.min(MAX_SCALE, Math.max(lo, Math.round(v)));
    state.scale = v; scaleIn.value = v; scaleNum.value = Math.round(v / 10) * 10;
    if (!fromAnim && state.anim) { cancelAnimationFrame(state.anim); state.anim = null; }
    draw();
  }
  function animateTo(target, ms) {
    if (state.anim) cancelAnimationFrame(state.anim);
    const from = state.scale, t0 = performance.now();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setScale(target); return; }
    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    function step(now) {
      const t = Math.min(1, (now - t0) / ms);
      setScale(from + (target - from) * ease(t), true);
      if (t < 1) state.anim = requestAnimationFrame(step); else state.anim = null;
    }
    state.anim = requestAnimationFrame(step);
  }

  const renderBox = $('render'), renderVideo = $('renderVideo'), renderBtn = $('renderBtn');
  function showRender(on) {
    const sc = S();
    if (on && !sc.video) return;
    state.render = on;
    renderBox.hidden = !on; renderBtn.classList.toggle('on', on);
    renderBtn.textContent = on ? 'Back to the slider' : 'Runway render';
    if (on) { if (renderVideo.getAttribute('src') !== sc.video) { renderVideo.src = sc.video; renderVideo.load(); } renderVideo.currentTime = 0; renderVideo.play().catch(() => {}); }
    else { renderVideo.pause(); }
  }
  renderBtn.addEventListener('click', () => showRender(!state.render));

  function selectScene(i, autoplay) {
    if (state.anim) { cancelAnimationFrame(state.anim); state.anim = null; }
    showRender(false);
    state.i = i; const sc = SCENES[i];
    document.querySelectorAll('.tab').forEach((b, k) => b.setAttribute('aria-selected', k === i ? 'true' : 'false'));
    canvas.width = sc.W; canvas.height = sc.H;
    scaleIn.min = sc.leftScale; scaleNum.min = sc.leftScale; $('endL').textContent = `${fmt(sc.leftScale)} : 1`;
    $('reset').textContent = `Back to ${fmt(sc.leftScale)} : 1`;
    $('lede').innerHTML = sc.lede; $('how').innerHTML = sc.how; $('foot').textContent = sc.foot;
    state.scale = sc.leftScale; scaleIn.value = sc.leftScale; scaleNum.value = sc.leftScale;
    $('loading').hidden = !!(cache[i] && cache[i].ready);
    renderBtn.disabled = !sc.video; renderBtn.title = sc.video ? 'Runway image-to-video render of this scene' : 'No Runway render embedded for this photo yet';
    load(i, () => { $('loading').hidden = true; draw(); if (autoplay) setTimeout(() => { if (state.i === i && state.scale === sc.leftScale && !state.anim) animateTo(MAX_SCALE, 5000); }, 700); });
    try { localStorage.setItem('risingPeaks.scene', String(i)); } catch (e) {}
  }

  SCENES.forEach((sc, i) => {
    const b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false');
    b.innerHTML = `<span>${sc.name}</span><small>${fmt(sc.leftScale)} : 1 · ${sc.plates.length} plate${sc.plates.length > 1 ? 's' : ''}</small>`;
    b.addEventListener('click', () => selectScene(i, true));
    $('tabs').appendChild(b);
  });

  scaleIn.addEventListener('input', e => setScale(+e.target.value));
  scaleNum.addEventListener('change', e => setScale(+e.target.value));
  $('height').addEventListener('input', e => { const h = parseFloat(e.target.value); if (h > 0) { state.height = h; draw(); } });
  $('outline').addEventListener('change', draw);
  $('layers').addEventListener('change', draw);
  $('reset').addEventListener('click', () => setScale(S().leftScale));
  $('play').addEventListener('click', () => { if (state.scale >= MAX_SCALE - 1) setScale(S().leftScale); animateTo(MAX_SCALE, 5000); });
  const hold = $('hold'), showOrig = on => { state.showOriginal = on; draw(); };
  hold.addEventListener('pointerdown', () => showOrig(true));
  hold.addEventListener('pointerup', () => showOrig(false));
  hold.addEventListener('pointerleave', () => showOrig(false));
  hold.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); showOrig(true); } });
  hold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') showOrig(false); });

  let start = 0;
  try { const v = parseInt(localStorage.getItem('risingPeaks.scene') || '0', 10); if (v >= 0 && v < SCENES.length) start = v; } catch (e) {}
  selectScene(start, true);
})();
</script>
